version: "v1.0"
name: onlylogs
agent:
  machine:
    type: f1-standard-2
    os_image: ubuntu2404
auto_cancel:
  running:
    when: "true"

global_job_config:
  prologue:
    commands:
      - checkout --use-cache
      - sem-version ruby $(cat .ruby-version) -f
      - cache restore gems-$(checksum Gemfile.lock)
      - bundle config set path 'vendor/bundle'
      - bundle install -j 4
      - cache store gems-$(checksum Gemfile.lock) vendor/bundle

blocks:
  - name: linter
    execution_time_limit:
      minutes: 5
    dependencies: []
    task:
      jobs:
        - name: fastcheck
          commands:
            - bin/fastcheck
  - name: tests
    execution_time_limit:
      minutes: 15
    dependencies: []
    task:
      env_vars:
        - name: RAILS_ENV
          value: test
      prologue:
        commands:
          - sudo apt-get update && sudo apt-get install --no-install-recommends -y ripgrep
      jobs:
        - name: check
          commands:
            - bin/check
promotions:
  - name: release
    pipeline_file: release.yml
    auto_promote:
      when: "result = 'passed' and tag =~ '^[0-9]+[.][0-9]+[.][0-9]+$'"
